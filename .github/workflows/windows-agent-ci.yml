name: Windows Agent v0.7 CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**"]
    paths:
      - "agents/windows-agent/**"
      - "services/device-edge-service/**"
      - ".github/workflows/windows-agent-ci.yml"
  pull_request:
    paths:
      - "agents/windows-agent/**"
      - "services/device-edge-service/**"
      - ".github/workflows/windows-agent-ci.yml"

permissions:
  contents: read

jobs:
  agent-portable-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agents/windows-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: agents/windows-agent/go.sum
      - run: go mod verify
      - run: go test -race ./...
      - run: go vet ./...
      - name: Reject insecure TLS and arbitrary shell primitives
        run: |
          if grep -RInE 'InsecureSkipVerify[[:space:]]*:[[:space:]]*true' --include='*.go' .; then
            echo 'InsecureSkipVerify=true is forbidden' >&2
            exit 1
          fi
          if grep -RInE 'os/exec|cmd\.exe|powershell(\.exe)?' --include='*.go' internal/commands; then
            echo 'arbitrary shell/process execution primitives are forbidden in command executor' >&2
            exit 1
          fi

  device-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/device-edge-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: false
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build -trimpath ./cmd/device-edge
      - name: Reject insecure Device Edge TLS
        run: |
          if grep -RInE 'InsecureSkipVerify[[:space:]]*:[[:space:]]*true|ClientAuth[[:space:]]*:[[:space:]]*tls\.NoClientCert' --include='*.go' .; then
            echo 'insecure Device Edge TLS configuration is forbidden' >&2
            exit 1
          fi
      - name: Build non-root Device Edge image
        run: docker build -t itguardian-device-edge:ci .
      - name: Assert final image is non-root
        run: |
          user="$(docker image inspect itguardian-device-edge:ci --format '{{.Config.User}}')"
          test -n "$user"
          test "$user" != "0"
          test "$user" != "root"

  windows-build-package:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache-dependency-path: agents/windows-agent/go.sum

      - name: Test and vet Windows build graph
        working-directory: agents/windows-agent
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          go mod verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows x64 and arm64 binaries
        working-directory: agents/windows-agent
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force dist | Out-Null
          $env:GOOS = 'windows'
          $env:GOARCH = 'amd64'
          go build -trimpath -ldflags '-s -w -X main.version=0.7.0-dev.1' -o dist/itguardian-agent-amd64.exe ./cmd/itguardian-agent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:GOARCH = 'arm64'
          go build -trimpath -ldflags '-s -w -X main.version=0.7.0-dev.1' -o dist/itguardian-agent-arm64.exe ./cmd/itguardian-agent
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:GOOS
          Remove-Item Env:GOARCH
          if ((Get-Item dist/itguardian-agent-amd64.exe).Length -le 0) { throw 'empty amd64 executable' }
          if ((Get-Item dist/itguardian-agent-arm64.exe).Length -le 0) { throw 'empty arm64 executable' }

      - name: Source security scan
        run: |
          $ErrorActionPreference = 'Stop'
          $tls = Get-ChildItem agents/windows-agent -Recurse -Filter *.go | Select-String -Pattern 'InsecureSkipVerify\s*:\s*true'
          if ($tls) { $tls | ForEach-Object { Write-Error $_ }; throw 'insecure TLS source detected' }
          $shell = Get-ChildItem agents/windows-agent/internal/commands -Recurse -Filter *.go | Select-String -Pattern 'os/exec|cmd\.exe|powershell(\.exe)?'
          if ($shell) { $shell | ForEach-Object { Write-Error $_ }; throw 'arbitrary shell primitive detected' }

      - name: Install pinned WiX v4 CLI and Util extension
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet tool install --global wix --version 4.0.6
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $wix = "$env:USERPROFILE\.dotnet\tools\wix.exe"
          & $wix extension add -g WixToolset.Util.wixext/4.0.6
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $wix extension list -g
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build x64 MSI
        working-directory: agents/windows-agent
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $wix = "$env:USERPROFILE\.dotnet\tools\wix.exe"
          & $wix build `
            -ext WixToolset.Util.wixext/4.0.6 `
            -arch x64 `
            -d AgentExe="$PWD\dist\itguardian-agent-amd64.exe" `
            -d ProductVersion=0.7.0 `
            -o "$PWD\dist\ITGuardian-Agent-0.7.0-x64.msi" `
            "$PWD\packaging\windows\Product.wxs"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Item dist/ITGuardian-Agent-0.7.0-x64.msi).Length -le 0) { throw 'empty MSI' }

      - name: Produce SHA-256 manifest
        working-directory: agents/windows-agent
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(
            'dist/itguardian-agent-amd64.exe',
            'dist/itguardian-agent-arm64.exe',
            'dist/ITGuardian-Agent-0.7.0-x64.msi'
          )
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: itguardian-windows-agent-v0.7
          path: |
            agents/windows-agent/dist/itguardian-agent-amd64.exe
            agents/windows-agent/dist/itguardian-agent-arm64.exe
            agents/windows-agent/dist/ITGuardian-Agent-0.7.0-x64.msi
            agents/windows-agent/dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
