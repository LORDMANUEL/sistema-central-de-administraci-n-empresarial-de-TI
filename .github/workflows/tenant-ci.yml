name: Tenant Service CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**"]
    paths:
      - "services/tenant-service/**"
      - ".github/workflows/tenant-ci.yml"
      - "compose.yaml"
  pull_request:
    paths:
      - "services/tenant-service/**"
      - ".github/workflows/tenant-ci.yml"
      - "compose.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/tenant-service/pyproject.toml
      - name: Install
        working-directory: services/tenant-service
        run: pip install -e '.[test]'
      - name: Compile
        run: python -m compileall services/tenant-service/app
      - name: Test
        working-directory: services/tenant-service
        run: python -m pytest -q
      - name: Migration round-trip
        working-directory: services/tenant-service
        env:
          TENANT_DATABASE_URL: sqlite+pysqlite:///./ci-tenant.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Tenant Service image
        run: docker build -t it-guardian-tenant:ci services/tenant-service

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: ci-password-not-for-production
          IDENTITY_SIGNING_KEY: aXQtZ3VhcmRpYW4tY2ktZWQyNTUxOS1zZWVkLXYxISE
          ENROLLMENT_SIGNING_KEY: aXRndWFyZGlhbi1lbnJvbGwtY2ktc2VlZC12MSEhISE
        run: docker compose config --quiet
