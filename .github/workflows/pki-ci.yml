name: PKI Service CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**"]
    paths:
      - "services/pki-service/**"
      - "tests/e2e/pki_smoke.py"
      - "tests/e2e/pki_jwks_fixture.py"
      - "tests/e2e/compose.pki-smoke.yaml"
      - ".github/workflows/pki-ci.yml"
      - "compose.yaml"
      - ".env.example"
  pull_request:
    paths:
      - "services/pki-service/**"
      - "tests/e2e/pki_smoke.py"
      - "tests/e2e/pki_jwks_fixture.py"
      - "tests/e2e/compose.pki-smoke.yaml"
      - ".github/workflows/pki-ci.yml"
      - "compose.yaml"
      - ".env.example"

permissions:
  contents: read

env:
  DEVICE_PROXY_SHARED_SECRET: compose-ci-device-proxy-secret-not-for-production

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/pki-service/pyproject.toml
      - name: Install
        working-directory: services/pki-service
        run: pip install -e '.[test]'
      - name: Compile
        run: python -m compileall services/pki-service/app
      - name: Test
        working-directory: services/pki-service
        run: python -m pytest -q
      - name: Migration round-trip
        working-directory: services/pki-service
        env:
          PKI_DATABASE_URL: sqlite+pysqlite:///./ci-pki-migration.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root PKI image
        run: docker build -t it-guardian-pki:ci services/pki-service
      - name: Verify runtime user is non-root
        run: |
          uid="$(docker run --rm --entrypoint sh it-guardian-pki:ci -c 'id -u')"
          test "$uid" != "0"

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral smoke Enrollment seed
        run: python -c 'import base64,secrets; print("PKI_SMOKE_ENROLLMENT_SEED=" + base64.urlsafe_b64encode(secrets.token_bytes(32)).rstrip(b"=").decode())' >> "$GITHUB_ENV"
      - name: Validate base Compose configuration
        env:
          POSTGRES_PASSWORD: ci-password-not-for-production
          IDENTITY_SIGNING_KEY: aXQtZ3VhcmRpYW4tY2ktZWQyNTUxOS1zZWVkLXYxISE
          ENROLLMENT_SIGNING_KEY: aXRndWFyZGlhbi1lbnJvbGwtY2ktc2VlZC12MSEhISE
        run: docker compose config --quiet
      - name: Validate PKI smoke overlay
        env:
          POSTGRES_PASSWORD: ci-password-not-for-production
          IDENTITY_SIGNING_KEY: aXQtZ3VhcmRpYW4tY2ktZWQyNTUxOS1zZWVkLXYxISE
          ENROLLMENT_SIGNING_KEY: aXRndWFyZGlhbi1lbnJvbGwtY2ktc2VlZC12MSEhISE
        run: docker compose -f compose.yaml -f tests/e2e/compose.pki-smoke.yaml --profile smoke config --quiet

  pki-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test, docker-build, compose-config]
    env:
      POSTGRES_PASSWORD: ci-password-not-for-production
      IDENTITY_SIGNING_KEY: aXQtZ3VhcmRpYW4tY2ktZWQyNTUxOS1zZWVkLXYxISE
      ENROLLMENT_SIGNING_KEY: aXRndWFyZGlhbi1lbnJvbGwtY2ktc2VlZC12MSEhISE
      GUARDIAN_ENV: production
    steps:
      - uses: actions/checkout@v4
      - name: Generate ephemeral Enrollment signing seed
        run: python -c 'import base64,secrets; print("PKI_SMOKE_ENROLLMENT_SEED=" + base64.urlsafe_b64encode(secrets.token_bytes(32)).rstrip(b"=").decode())' >> "$GITHUB_ENV"
      - name: Ensure clean volumes before smoke
        run: docker compose -f compose.yaml -f tests/e2e/compose.pki-smoke.yaml down -v --remove-orphans || true
      - name: Build and start clean Guardian PKI stack
        run: docker compose -f compose.yaml -f tests/e2e/compose.pki-smoke.yaml up -d --build
      - name: Exercise issuance revocation CRL and JetStream
        run: docker compose -f compose.yaml -f tests/e2e/compose.pki-smoke.yaml --profile smoke run --rm --no-deps pki-smoke-client
      - name: Verify Root key and Enrollment signer isolation
        run: |
          pki_id="$(docker compose -f compose.yaml -f tests/e2e/compose.pki-smoke.yaml ps -q pki-service)"
          worker_id="$(docker compose -f compose.yaml -f tests/e2e/compose.pki-smoke.yaml ps -q pki-outbox-worker)"
          python - "$pki_id" "$worker_id" <<'PY'
          import json
          import subprocess
          import sys

          pki_id, worker_id = sys.argv[1:]
          assert pki_id and worker_id
          pki = json.loads(subprocess.check_output(["docker", "inspect", pki_id]))[0]
          worker = json.loads(subprocess.check_output(["docker", "inspect", worker_id]))[0]
          pki_mounts = {item["Destination"]: item for item in pki["Mounts"]}
          worker_mounts = {item["Destination"]: item for item in worker["Mounts"]}
          assert "/var/lib/guardian/pki-root" not in pki_mounts
          assert "/var/lib/guardian/pki" in pki_mounts
          assert pki_mounts["/var/lib/guardian/pki"]["RW"] is False
          assert "/var/lib/guardian/pki-root" not in worker_mounts
          assert "/var/lib/guardian/pki" not in worker_mounts
          assert not any(value.startswith("PKI_SMOKE_ENROLLMENT_SEED=") for value in pki["Config"]["Env"])
          PY
      - name: Verify CA initialization is idempotent in persisted volumes
        run: |
          before="$(docker compose -f compose.yaml -f tests/e2e/compose.pki-smoke.yaml exec -T pki-service python -c 'from pathlib import Path; from cryptography import x509; from cryptography.hazmat.primitives import hashes; print(x509.load_pem_x509_certificate(Path("/var/lib/guardian/pki/intermediate-ca-cert.pem").read_bytes()).fingerprint(hashes.SHA256()).hex())')"
          docker compose -f compose.yaml -f tests/e2e/compose.pki-smoke.yaml run --rm pki-ca-init
          after="$(docker compose -f compose.yaml -f tests/e2e/compose.pki-smoke.yaml exec -T pki-service python -c 'from pathlib import Path; from cryptography import x509; from cryptography.hazmat.primitives import hashes; print(x509.load_pem_x509_certificate(Path("/var/lib/guardian/pki/intermediate-ca-cert.pem").read_bytes()).fingerprint(hashes.SHA256()).hex())')"
          test "$before" = "$after"
      - name: Dump stack state on failure
        if: failure()
        run: |
          docker compose -f compose.yaml -f tests/e2e/compose.pki-smoke.yaml ps -a
          docker compose -f compose.yaml -f tests/e2e/compose.pki-smoke.yaml logs --no-color --tail=400
      - name: Tear down smoke stack and volumes
        if: always()
        run: docker compose -f compose.yaml -f tests/e2e/compose.pki-smoke.yaml down -v --remove-orphans
