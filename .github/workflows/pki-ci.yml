name: PKI Service CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**"]
    paths:
      - "services/pki-service/**"
      - ".github/workflows/pki-ci.yml"
      - "compose.yaml"
      - ".env.example"
  pull_request:
    paths:
      - "services/pki-service/**"
      - ".github/workflows/pki-ci.yml"
      - "compose.yaml"
      - ".env.example"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/pki-service/pyproject.toml
      - name: Install
        working-directory: services/pki-service
        run: pip install -e '.[test]'
      - name: Compile
        run: python -m compileall services/pki-service/app
      - name: Test
        working-directory: services/pki-service
        run: python -m pytest -q
      - name: Migration round-trip
        working-directory: services/pki-service
        env:
          PKI_DATABASE_URL: sqlite+pysqlite:///./ci-pki-migration.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
