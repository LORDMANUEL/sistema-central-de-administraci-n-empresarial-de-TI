name: Audit Service CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**"]
    paths:
      - "services/audit-service/**"
      - "tests/e2e/audit_smoke.py"
      - ".github/workflows/audit-ci.yml"
      - "compose.yaml"
      - ".env.example"
  pull_request:
    paths:
      - "services/audit-service/**"
      - "tests/e2e/audit_smoke.py"
      - ".github/workflows/audit-ci.yml"
      - "compose.yaml"
      - ".env.example"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/audit-service/pyproject.toml
      - name: Install
        working-directory: services/audit-service
        run: pip install -e '.[test]'
      - name: Compile
        run: python -m compileall services/audit-service/app
      - name: Test
        working-directory: services/audit-service
        run: python -m pytest -q
      - name: Migration round-trip
        working-directory: services/audit-service
        env:
          AUDIT_DATABASE_URL: sqlite+pysqlite:///./ci-audit-migration.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root Audit image
        run: docker build -t it-guardian-audit:ci services/audit-service
      - name: Verify runtime user is non-root
        run: |
          uid="$(docker run --rm --entrypoint sh it-guardian-audit:ci -c 'id -u')"
          test "$uid" != "0"

  compose-config:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-password-not-for-production
      IDENTITY_SIGNING_KEY: aXQtZ3VhcmRpYW4tY2ktZWQyNTUxOS1zZWVkLXYxISE
      ENROLLMENT_SIGNING_KEY: aXRndWFyZGlhbi1lbnJvbGwtY2ktc2VlZC12MSEhISE
      GUARDIAN_ENV: production
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet

  postgres-append-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [docker-build, compose-config]
    env:
      POSTGRES_PASSWORD: ci-password-not-for-production
      IDENTITY_SIGNING_KEY: aXQtZ3VhcmRpYW4tY2ktZWQyNTUxOS1zZWVkLXYxISE
      ENROLLMENT_SIGNING_KEY: aXRndWFyZGlhbi1lbnJvbGwtY2ktc2VlZC12MSEhISE
      GUARDIAN_ENV: production
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL and migrate Audit
        run: |
          docker compose up -d postgres
          docker compose up --build audit-db-init audit-migrate
      - name: Insert immutable audit fixture
        run: |
          docker compose exec -T postgres psql -U guardian -d guardian_audit <<'SQL'
          INSERT INTO audit_records (
            id, tenant_id, sequence, chain_key, source_event_id, source_type, source_service,
            actor_user_id, actor_type, action, resource_type, resource_id, outcome, request_id,
            occurred_at, ingested_at, metadata_json, prev_hash, record_hash
          ) VALUES (
            '11111111-1111-1111-1111-111111111111', NULL, 1, 'platform', 'ci-append-event-1',
            'ci.audit.fixture', 'ci', NULL, 'system', 'ci.audit.fixture', 'fixture', 'fixture-1',
            'success', 'ci-request-1', now(), now(), '{}'::jsonb, repeat('0',64), repeat('1',64)
          );
          SQL
      - name: Reject UPDATE and DELETE at PostgreSQL layer
        run: |
          if docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U guardian -d guardian_audit -c "UPDATE audit_records SET outcome='failure' WHERE source_event_id='ci-append-event-1'"; then
            echo 'UPDATE unexpectedly succeeded' >&2
            exit 1
          fi
          if docker compose exec -T postgres psql -v ON_ERROR_STOP=1 -U guardian -d guardian_audit -c "DELETE FROM audit_records WHERE source_event_id='ci-append-event-1'"; then
            echo 'DELETE unexpectedly succeeded' >&2
            exit 1
          fi
          count="$(docker compose exec -T postgres psql -U guardian -d guardian_audit -tAc "SELECT count(*) FROM audit_records WHERE source_event_id='ci-append-event-1'")"
          test "$count" = "1"
      - name: Dump state on failure
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Tear down volumes
        if: always()
        run: docker compose down -v --remove-orphans

  clean-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [test, docker-build, compose-config, postgres-append-only]
    env:
      POSTGRES_PASSWORD: ci-password-not-for-production
      IDENTITY_SIGNING_KEY: aXQtZ3VhcmRpYW4tY2ktZWQyNTUxOS1zZWVkLXYxISE
      ENROLLMENT_SIGNING_KEY: aXRndWFyZGlhbi1lbnJvbGwtY2ktc2VlZC12MSEhISE
      GUARDIAN_ENV: production
    steps:
      - uses: actions/checkout@v4
      - name: Ensure clean volumes before certification
        run: docker compose down -v --remove-orphans || true
      - name: Build and start clean Guardian v0.4 plus Audit stack
        run: docker compose up -d --build
      - name: Exercise certified Identity to Tenant to Asset to Enrollment to PKI flow
        run: python tests/e2e/enrollment_smoke.py
      - name: Certify Audit chain dedupe isolation append-only and secret safety
        run: python tests/e2e/audit_smoke.py
      - name: Verify Audit consumer secret isolation at runtime
        run: |
          consumer_id="$(docker compose ps -q audit-consumer)"
          test -n "$consumer_id"
          python - "$consumer_id" <<'PY'
          import json
          import subprocess
          import sys

          consumer_id = sys.argv[1]
          inspected = json.loads(subprocess.check_output(["docker", "inspect", consumer_id]))[0]
          env = inspected["Config"]["Env"]
          forbidden_prefixes = (
              "IDENTITY_SIGNING_KEY=",
              "ENROLLMENT_SIGNING_KEY=",
              "PKI_CA_KEY_PATH=",
              "AUDIT_IDENTITY_JWKS_URL=",
              "AUDIT_TENANT_SERVICE_URL=",
          )
          assert not any(value.startswith(forbidden_prefixes) for value in env), env
          mounts = {item["Destination"] for item in inspected["Mounts"]}
          assert "/var/lib/guardian/pki-root" not in mounts, mounts
          assert "/var/lib/guardian/pki" not in mounts, mounts
          PY
      - name: Dump clean-stack state on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=700
      - name: Tear down clean stack and volumes
        if: always()
        run: docker compose down -v --remove-orphans
