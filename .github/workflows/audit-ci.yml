name: Audit Service CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**"]
    paths:
      - "services/audit-service/**"
      - ".github/workflows/audit-ci.yml"
      - "compose.yaml"
      - ".env.example"
  pull_request:
    paths:
      - "services/audit-service/**"
      - ".github/workflows/audit-ci.yml"
      - "compose.yaml"
      - ".env.example"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/audit-service/pyproject.toml
      - name: Install
        working-directory: services/audit-service
        run: pip install -e '.[test]'
      - name: Test
        working-directory: services/audit-service
        run: python -m pytest -q
