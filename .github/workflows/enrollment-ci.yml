name: Enrollment Service CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**"]
    paths:
      - "services/enrollment-service/**"
      - "tests/e2e/enrollment_smoke.py"
      - ".github/workflows/enrollment-ci.yml"
      - "compose.yaml"
      - ".env.example"
  pull_request:
    paths:
      - "services/enrollment-service/**"
      - "tests/e2e/enrollment_smoke.py"
      - ".github/workflows/enrollment-ci.yml"
      - "compose.yaml"
      - ".env.example"

permissions:
  contents: read

env:
  DEVICE_PROXY_SHARED_SECRET: compose-ci-device-proxy-secret-not-for-production
  VALKEY_PASSWORD: compose-ci-valkey-secret-not-for-production

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/enrollment-service/pyproject.toml
      - name: Install
        working-directory: services/enrollment-service
        run: pip install -e '.[test]'
      - name: Compile
        run: python -m compileall services/enrollment-service/app
      - name: Test
        working-directory: services/enrollment-service
        run: python -m pytest -q
      - name: Migration round-trip
        working-directory: services/enrollment-service
        env:
          ENROLLMENT_DATABASE_URL: sqlite+pysqlite:///./ci-enrollment-migration.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root Enrollment image
        run: docker build -t it-guardian-enrollment:ci services/enrollment-service
      - name: Verify runtime user is non-root
        run: |
          uid="$(docker run --rm --entrypoint sh it-guardian-enrollment:ci -c 'id -u')"
          test "$uid" != "0"

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: ci-password-not-for-production
          IDENTITY_SIGNING_KEY: aXQtZ3VhcmRpYW4tY2ktZWQyNTUxOS1zZWVkLXYxISE
          ENROLLMENT_SIGNING_KEY: aXRndWFyZGlhbi1lbnJvbGwtY2ktc2VlZC12MSEhISE
        run: docker compose config --quiet

  enrollment-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [test, docker-build, compose-config]
    env:
      POSTGRES_PASSWORD: ci-password-not-for-production
      IDENTITY_SIGNING_KEY: aXQtZ3VhcmRpYW4tY2ktZWQyNTUxOS1zZWVkLXYxISE
      ENROLLMENT_SIGNING_KEY: aXRndWFyZGlhbi1lbnJvbGwtY2ktc2VlZC12MSEhISE
      GUARDIAN_ENV: production
    steps:
      - uses: actions/checkout@v4
      - name: Ensure clean volumes before smoke
        run: docker compose down -v --remove-orphans || true
      - name: Build and start clean Guardian stack
        run: docker compose up -d --build
      - name: Exercise token to PKI to device enrollment
        run: python tests/e2e/enrollment_smoke.py
      - name: Verify device.enrolled reached JetStream
        run: |
          docker compose exec -T enrollment-service python - <<'PY'
          import asyncio
          import json
          import nats

          async def main():
              nc = await nats.connect("nats://nats:4222")
              js = nc.jetstream()
              sub = await js.pull_subscribe("guardian.device.enrolled")
              messages = await sub.fetch(1, timeout=15)
              assert messages, "No guardian.device.enrolled event found"
              event = json.loads(messages[0].data)
              assert event["schema_version"] == 1, event
              assert event["type"] == "device.enrolled", event
              assert event["data"]["device_id"], event
              assert event["data"]["certificate_id"], event
              assert "token" not in event["data"], event
              assert "csr_pem" not in event["data"], event
              await nc.drain()

          asyncio.run(main())
          PY
      - name: Verify Enrollment signer and CA isolation
        run: |
          api_id="$(docker compose ps -q enrollment-service)"
          worker_id="$(docker compose ps -q enrollment-outbox-worker)"
          python - "$api_id" "$worker_id" <<'PY'
          import json
          import subprocess
          import sys

          api_id, worker_id = sys.argv[1:]
          assert api_id and worker_id
          api = json.loads(subprocess.check_output(["docker", "inspect", api_id]))[0]
          worker = json.loads(subprocess.check_output(["docker", "inspect", worker_id]))[0]
          api_env = api["Config"]["Env"]
          worker_env = worker["Config"]["Env"]
          assert any(value.startswith("ENROLLMENT_SIGNING_KEY=") for value in api_env)
          assert not any(value.startswith("ENROLLMENT_SIGNING_KEY=") for value in worker_env)
          for inspected in (api, worker):
              mounts = {item["Destination"] for item in inspected["Mounts"]}
              assert "/var/lib/guardian/pki-root" not in mounts
              assert "/var/lib/guardian/pki" not in mounts
          PY
      - name: Dump stack state on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=500
      - name: Tear down smoke stack and volumes
        if: always()
        run: docker compose down -v --remove-orphans
