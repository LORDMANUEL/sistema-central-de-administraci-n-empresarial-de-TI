name: Gateway Service CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**"]
    paths:
      - "services/gateway-service/**"
      - "tests/e2e/gateway_audit_smoke.py"
      - ".github/workflows/gateway-ci.yml"
      - "compose.yaml"
      - "compose.override.yaml"
      - ".env.example"
  pull_request:
    paths:
      - "services/gateway-service/**"
      - "tests/e2e/gateway_audit_smoke.py"
      - ".github/workflows/gateway-ci.yml"
      - "compose.yaml"
      - "compose.override.yaml"
      - ".env.example"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/gateway-service/pyproject.toml
      - name: Install
        working-directory: services/gateway-service
        run: pip install -e '.[test]'
      - name: Compile
        run: python -m compileall services/gateway-service/app
      - name: Test
        working-directory: services/gateway-service
        run: python -m pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root Gateway image
        run: docker build -t it-guardian-gateway:ci services/gateway-service
      - name: Verify runtime user is non-root
        run: |
          uid="$(docker run --rm --entrypoint sh it-guardian-gateway:ci -c 'id -u')"
          test "$uid" != "0"

  compose-config:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-password-not-for-production
      IDENTITY_SIGNING_KEY: aXQtZ3VhcmRpYW4tY2ktZWQyNTUxOS1zZWVkLXYxISE
      ENROLLMENT_SIGNING_KEY: aXRndWFyZGlhbi1lbnJvbGwtY2ktc2VlZC12MSEhISE
      GUARDIAN_ENV: production
    steps:
      - uses: actions/checkout@v4
      - name: Validate base plus automatic Gateway override
        run: docker compose config --quiet
      - name: Require Gateway in effective Compose model
        run: |
          docker compose config --services | grep -Fx gateway-service

  clean-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, docker-build, compose-config]
    env:
      POSTGRES_PASSWORD: ci-password-not-for-production
      IDENTITY_SIGNING_KEY: aXQtZ3VhcmRpYW4tY2ktZWQyNTUxOS1zZWVkLXYxISE
      ENROLLMENT_SIGNING_KEY: aXRndWFyZGlhbi1lbnJvbGwtY2ktc2VlZC12MSEhISE
      GUARDIAN_ENV: production
      GATEWAY_PORT: 8080
    steps:
      - uses: actions/checkout@v4
      - name: Ensure clean volumes before certification
        run: docker compose down -v --remove-orphans || true
      - name: Build and start complete Guardian v0.5 candidate stack
        run: docker compose up -d --build
      - name: Certify Core path through Gateway and Audit
        run: python tests/e2e/gateway_audit_smoke.py
      - name: Verify Gateway runtime secret and CA isolation
        run: |
          gateway_id="$(docker compose ps -q gateway-service)"
          test -n "$gateway_id"
          python - "$gateway_id" <<'PY'
          import json
          import subprocess
          import sys

          gateway_id = sys.argv[1]
          inspected = json.loads(subprocess.check_output(["docker", "inspect", gateway_id]))[0]
          env = inspected["Config"]["Env"]
          forbidden_prefixes = (
              "IDENTITY_SIGNING_KEY=",
              "ENROLLMENT_SIGNING_KEY=",
              "PKI_CA_KEY_PATH=",
              "PKI_DATABASE_URL=",
              "AUDIT_DATABASE_URL=",
          )
          assert not any(value.startswith(forbidden_prefixes) for value in env), env
          mounts = {item["Destination"] for item in inspected["Mounts"]}
          assert "/var/lib/guardian/pki-root" not in mounts, mounts
          assert "/var/lib/guardian/pki" not in mounts, mounts
          PY
      - name: Dump clean-stack state on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=900
      - name: Tear down clean stack and volumes
        if: always()
        run: docker compose down -v --remove-orphans
