name: Identity Service CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**"]
    paths:
      - "services/identity-service/**"
      - ".github/workflows/identity-ci.yml"
      - "compose.yaml"
  pull_request:
    paths:
      - "services/identity-service/**"
      - ".github/workflows/identity-ci.yml"
      - "compose.yaml"

permissions:
  contents: read

env:
  DEVICE_PROXY_SHARED_SECRET: compose-ci-device-proxy-secret-not-for-production

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/identity-service/pyproject.toml
      - name: Install
        working-directory: services/identity-service
        run: pip install -e '.[test]'
      - name: Compile
        run: python -m compileall services/identity-service/app
      - name: Test
        working-directory: services/identity-service
        run: python -m pytest -q
      - name: Migration smoke test
        working-directory: services/identity-service
        env:
          IDENTITY_DATABASE_URL: sqlite+pysqlite:///./ci-migration.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Identity Service image
        run: docker build -t it-guardian-identity:ci services/identity-service

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: ci-password-not-for-production
          IDENTITY_SIGNING_KEY: aXQtZ3VhcmRpYW4tY2ktZWQyNTUxOS1zZWVkLXYxISE
          ENROLLMENT_SIGNING_KEY: aXRndWFyZGlhbi1lbnJvbGwtY2ktc2VlZC12MSEhISE
        run: docker compose config --quiet
