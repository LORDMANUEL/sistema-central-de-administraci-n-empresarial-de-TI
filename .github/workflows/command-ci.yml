name: Command Service CI
on:
  push:
    branches: [feature/v0.6.0-agent-control-command-telemetry]
    paths: ['services/command-service/**', '.github/workflows/command-ci.yml']
  pull_request:
    paths: ['services/command-service/**', '.github/workflows/command-ci.yml']
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: services/command-service}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: services/command-service/pyproject.toml}
      - run: pip install -e '.[test]'
      - run: python -m compileall app
      - run: python -m pytest -q
      - name: Migration roundtrip
        run: COMMAND_DATABASE_URL=sqlite+pysqlite:///./ci.db alembic upgrade head && COMMAND_DATABASE_URL=sqlite+pysqlite:///./ci.db alembic downgrade base && COMMAND_DATABASE_URL=sqlite+pysqlite:///./ci.db alembic upgrade head
      - name: Docker build
        run: docker build -t it-guardian-command:ci .
