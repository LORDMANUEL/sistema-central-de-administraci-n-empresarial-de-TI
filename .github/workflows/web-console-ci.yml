name: Web Console v0.8 CI

on:
  push:
    branches:
      - feature/v0.8.0-web-console
  pull_request:
    branches:
      - main
    paths:
      - 'apps/web-console/**'
      - 'services/web-console-service/**'
      - 'services/agent-control-service/**'
      - 'services/gateway-service/**'
      - 'tests/e2e/v08_console_fixture.py'
      - 'compose.override.yaml'
      - '.env.example'
      - '.github/workflows/web-console-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-control-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Agent Control
        working-directory: services/agent-control-service
        run: python -m pip install -e '.[test]'
      - name: Test Agent Control admin API
        working-directory: services/agent-control-service
        run: python -m pytest -q
      - name: Compile Agent Control
        working-directory: services/agent-control-service
        run: python -m compileall -q app

  gateway-admin-routes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Gateway
        working-directory: services/gateway-service
        run: python -m pip install -e '.[test]'
      - name: Test Gateway
        working-directory: services/gateway-service
        run: python -m pytest -q
      - name: Prove device plane is not northbound
        run: |
          if grep -R -nE '"/api/v1/device/' services/gateway-service/app/routes.py services/gateway-service/app/v06_routes.py services/gateway-service/app/v08_routes.py; then
            echo 'Device-plane route leaked into Gateway northbound registry' >&2
            exit 1
          fi

  bff-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install Web Console BFF
        working-directory: services/web-console-service
        run: python -m pip install -e '.[test]'
      - name: Test BFF
        working-directory: services/web-console-service
        run: python -m pytest -q
      - name: Compile BFF
        working-directory: services/web-console-service
        run: python -m compileall -q app
      - name: Enforce explicit BFF boundary
        run: |
          if grep -R -nE '(/api/v1/device/|X-Guardian-Proxy-Token|X-Guardian-Device-ID)' services/web-console-service/app; then
            echo 'Device-plane primitive found in Web Console BFF' >&2
            exit 1
          fi
          if grep -R -nE '(localStorage|sessionStorage|indexedDB)' services/web-console-service/app; then
            echo 'Browser persistence primitive found in BFF' >&2
            exit 1
          fi

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web-console/package.json
      - name: Install frontend
        working-directory: apps/web-console
        run: npm install --no-audit --no-fund
      - name: Test frontend
        working-directory: apps/web-console
        run: npm run test
      - name: Build frontend
        working-directory: apps/web-console
        run: npm run build
      - name: Reject browser token persistence
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('apps/web-console/src')
          forbidden = {
              'localStorage': re.compile(r'\blocalStorage\b'),
              'sessionStorage': re.compile(r'\bsessionStorage\b'),
              'indexedDB': re.compile(r'\bindexedDB\b'),
              'access_token': re.compile(r'\baccess_token\b'),
              'refresh_token': re.compile(r'\brefresh_token\b'),
              'browser bearer auth': re.compile(r'Authorization\s*[:=].*Bearer', re.I),
          }
          findings = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix not in {'.ts', '.tsx'} or '.test.' in path.name:
                  continue
              text = path.read_text(encoding='utf-8')
              for name, pattern in forbidden.items():
                  if pattern.search(text):
                      findings.append(f'{path}: {name}')
          if findings:
              raise SystemExit('Forbidden browser token storage/handling found:\n' + '\n'.join(findings))
          PY

  container-compose:
    runs-on: ubuntu-latest
    needs: [agent-control-admin, gateway-admin-routes, bff-security, frontend]
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      IDENTITY_SIGNING_KEY: ci-identity-seed
      ENROLLMENT_SIGNING_KEY: ci-enrollment-seed
      DEVICE_PROXY_SHARED_SECRET: ci-device-proxy-secret-long-value
      VALKEY_PASSWORD: ci-valkey-secret-long-value
      WEB_CONSOLE_COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@v4
      - name: Validate effective Compose model
        run: docker compose config >/tmp/compose-v08.yaml
      - name: Build Web Console image
        run: docker build -f services/web-console-service/Dockerfile -t it-guardian-web-console:v08-ci .
      - name: Assert non-root image
        run: |
          test "$(docker image inspect it-guardian-web-console:v08-ci --format '{{.Config.User}}')" = guardian
      - name: Assert Valkey is internal only
        run: |
          docker compose config --format json | python -c 'import json,sys; model=json.load(sys.stdin); assert not model["services"]["valkey"].get("ports"), model["services"]["valkey"].get("ports")'
      - name: Smoke static runtime
        run: |
          cid=$(docker run -d -p 127.0.0.1:18088:8000 it-guardian-web-console:v08-ci)
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:18088/health/live >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18088/health/live
          curl -fsS http://127.0.0.1:18088/console/ | grep -q '<div id="root"></div>'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18088/console/api/not-real)" = 404

  clean-stack-browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    needs: [container-compose]
    env:
      POSTGRES_PASSWORD: ci-password-not-for-production
      IDENTITY_SIGNING_KEY: aXQtZ3VhcmRpYW4tY2ktZWQyNTUxOS1zZWVkLXYxISE
      ENROLLMENT_SIGNING_KEY: aXRndWFyZGlhbi1lbnJvbGwtY2ktc2VlZC12MSEhISE
      DEVICE_PROXY_SHARED_SECRET: v08-ci-device-proxy-secret-not-for-production
      VALKEY_PASSWORD: ci-valkey-secret-long-value
      GUARDIAN_ENV: production
      WEB_CONSOLE_COOKIE_SECURE: 'false'
      GATEWAY_PORT: 8080
      WEB_CONSOLE_PORT: 8088
      DEVICE_EDGE_BIND_HOST: 127.0.0.1
      DEVICE_EDGE_PORT: 8443
      DEVICE_EDGE_TLS_SERVER_NAMES: localhost,device-edge-service
      DEVICE_EDGE_CRL_REFRESH_SECONDS: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web-console/package.json
      - name: Start v0.8 from empty volumes
        run: |
          docker compose down -v --remove-orphans || true
          docker compose up -d --build
      - name: Prepare real mTLS endpoint fixture
        run: |
          runtime="$RUNNER_TEMP/guardian-v08-console"
          mkdir -p "$runtime"
          python tests/e2e/v08_console_fixture.py prepare "$runtime"
          echo "GUARDIAN_V08_FIXTURE=$runtime/fixture.json" >> "$GITHUB_ENV"
          echo "GUARDIAN_V08_RUNTIME=$runtime" >> "$GITHUB_ENV"
      - name: Wait for Web Console readiness
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8088/health/ready >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Start mTLS device command consumer
        run: |
          python tests/e2e/v08_console_fixture.py agent-loop "$GUARDIAN_V08_RUNTIME" --timeout 300 >"$GUARDIAN_V08_RUNTIME/agent.log" 2>&1 &
          echo $! > "$GUARDIAN_V08_RUNTIME/agent.pid"
      - name: Install browser test dependencies
        working-directory: apps/web-console
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Certify Web Console through Chromium
        working-directory: apps/web-console
        env:
          WEB_CONSOLE_E2E_BASE_URL: http://127.0.0.1:8088/console/
        run: npm run test:e2e
      - name: Require mTLS agent command completion
        run: |
          for i in $(seq 1 60); do
            if test -s "$GUARDIAN_V08_RUNTIME/agent-result.json"; then
              cat "$GUARDIAN_V08_RUNTIME/agent-result.json"
              exit 0
            fi
            pid="$(cat "$GUARDIAN_V08_RUNTIME/agent.pid")"
            if ! kill -0 "$pid" 2>/dev/null; then
              cat "$GUARDIAN_V08_RUNTIME/agent.log" >&2 || true
              exit 1
            fi
            sleep 2
          done
          cat "$GUARDIAN_V08_RUNTIME/agent.log" >&2 || true
          exit 1
      - name: Verify v0.8 runtime isolation
        run: |
          docker compose config --format json > "$RUNNER_TEMP/v08-compose.json"
          python - "$RUNNER_TEMP/v08-compose.json" <<'PY'
          import json, subprocess, sys
          for service in ('web-console-service', 'device-edge-service'):
              cid = subprocess.check_output(['docker','compose','ps','-q',service], text=True).strip()
              assert cid, service
              inspected = json.loads(subprocess.check_output(['docker','inspect',cid], text=True))[0]
              assert str(inspected['Config'].get('User','')) not in {'','0','root','0:0'}, (service, inspected['Config'].get('User'))
          model = json.load(open(sys.argv[1], encoding='utf-8'))
          assert not model['services']['valkey'].get('ports'), model['services']['valkey'].get('ports')
          PY
      - name: Dump v0.8 browser/stack state on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=1800
          test -f "$GUARDIAN_V08_RUNTIME/agent.log" && cat "$GUARDIAN_V08_RUNTIME/agent.log" || true
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v08-playwright-failure
          path: |
            apps/web-console/test-results
            apps/web-console/playwright-report
          if-no-files-found: ignore
          retention-days: 14
      - name: Tear down containers and volumes
        if: always()
        run: docker compose down -v --remove-orphans
