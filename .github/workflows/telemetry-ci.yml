name: Telemetry Service CI
on:
  push:
    branches: [feature/v0.6.0-agent-control-command-telemetry]
    paths: ['services/telemetry-service/**', '.github/workflows/telemetry-ci.yml']
  pull_request:
    paths: ['services/telemetry-service/**', '.github/workflows/telemetry-ci.yml']
permissions: {contents: read}
jobs:
  test:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: services/telemetry-service}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: services/telemetry-service/pyproject.toml}
      - run: pip install -e '.[test]'
      - run: python -m compileall app
      - run: python -m pytest -q
      - name: Migration roundtrip
        run: TELEMETRY_DATABASE_URL=sqlite+pysqlite:///./ci.db alembic upgrade head && TELEMETRY_DATABASE_URL=sqlite+pysqlite:///./ci.db alembic downgrade base && TELEMETRY_DATABASE_URL=sqlite+pysqlite:///./ci.db alembic upgrade head
      - name: Docker build
        run: docker build -t it-guardian-telemetry:ci .
