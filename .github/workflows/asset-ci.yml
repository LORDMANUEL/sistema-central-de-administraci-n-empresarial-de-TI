name: Asset Service CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**"]
    paths:
      - "services/asset-service/**"
      - ".github/workflows/asset-ci.yml"
      - "compose.yaml"
      - ".env.example"
  pull_request:
    paths:
      - "services/asset-service/**"
      - ".github/workflows/asset-ci.yml"
      - "compose.yaml"
      - ".env.example"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/asset-service/pyproject.toml
      - name: Install
        working-directory: services/asset-service
        run: pip install -e '.[test]'
      - name: Compile
        run: python -m compileall services/asset-service/app
      - name: Test
        working-directory: services/asset-service
        run: python -m pytest -q
      - name: Migration round-trip
        working-directory: services/asset-service
        env:
          ASSET_DATABASE_URL: sqlite+pysqlite:///./ci-asset-migration.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Asset Service image
        run: docker build -t it-guardian-asset:ci services/asset-service

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: ci-password-not-for-production
          IDENTITY_SIGNING_KEY: aXQtZ3VhcmRpYW4tY2ktZWQyNTUxOS1zZWVkLXYxISE
        run: docker compose config --quiet
