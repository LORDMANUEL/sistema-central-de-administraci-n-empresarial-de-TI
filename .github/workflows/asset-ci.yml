name: Asset Service CI

on:
  push:
    branches: [main, develop, "feature/**", "release/**"]
    paths:
      - "services/asset-service/**"
      - "services/tenant-service/**"
      - "tests/e2e/core_identity_tenant_asset.py"
      - ".github/workflows/asset-ci.yml"
      - "compose.yaml"
      - ".env.example"
  pull_request:
    paths:
      - "services/asset-service/**"
      - "services/tenant-service/**"
      - "tests/e2e/core_identity_tenant_asset.py"
      - ".github/workflows/asset-ci.yml"
      - "compose.yaml"
      - ".env.example"

permissions:
  contents: read

env:
  DEVICE_PROXY_SHARED_SECRET: compose-ci-device-proxy-secret-not-for-production
  VALKEY_PASSWORD: compose-ci-valkey-secret-not-for-production

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/asset-service/pyproject.toml
      - name: Install
        working-directory: services/asset-service
        run: pip install -e '.[test]'
      - name: Compile
        run: python -m compileall services/asset-service/app
      - name: Test
        working-directory: services/asset-service
        run: python -m pytest -q
      - name: Migration round-trip
        working-directory: services/asset-service
        env:
          ASSET_DATABASE_URL: sqlite+pysqlite:///./ci-asset-migration.db
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Asset Service image
        run: docker build -t it-guardian-asset:ci services/asset-service

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        env:
          POSTGRES_PASSWORD: ci-password-not-for-production
          IDENTITY_SIGNING_KEY: aXQtZ3VhcmRpYW4tY2ktZWQyNTUxOS1zZWVkLXYxISE
          ENROLLMENT_SIGNING_KEY: aXRndWFyZGlhbi1lbnJvbGwtY2ktc2VlZC12MSEhISE
        run: docker compose config --quiet

  core-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test, docker-build, compose-config]
    env:
      POSTGRES_PASSWORD: ci-password-not-for-production
      IDENTITY_SIGNING_KEY: aXQtZ3VhcmRpYW4tY2ktZWQyNTUxOS1zZWVkLXYxISE
      ENROLLMENT_SIGNING_KEY: aXRndWFyZGlhbi1lbnJvbGwtY2ktc2VlZC12MSEhISE
      GUARDIAN_ENV: production
    steps:
      - uses: actions/checkout@v4
      - name: Build and start clean stack
        run: docker compose up -d --build
      - name: Exercise Identity to Tenant to Asset
        run: python tests/e2e/core_identity_tenant_asset.py
      - name: Verify asset.created reached JetStream
        run: |
          docker compose exec -T asset-service python - <<'PY'
          import asyncio
          import json
          import nats

          async def main():
              nc = await nats.connect("nats://nats:4222")
              js = nc.jetstream()
              sub = await js.pull_subscribe("guardian.asset.created")
              messages = await sub.fetch(1, timeout=15)
              assert messages, "No guardian.asset.created event found"
              event = json.loads(messages[0].data)
              assert event["schema_version"] == 1, event
              assert event["type"] == "asset.created", event
              assert event["data"]["tenant_id"], event
              await nc.drain()

          asyncio.run(main())
          PY
      - name: Dump stack state on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=300
      - name: Tear down clean stack
        if: always()
        run: docker compose down -v --remove-orphans
