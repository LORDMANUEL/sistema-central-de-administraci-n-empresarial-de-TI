services:
  enrollment-service:
    build:
      context: ./services/pki-service
    restart: unless-stopped
    environment:
      PKI_SMOKE_ENROLLMENT_SEED: ${PKI_SMOKE_ENROLLMENT_SEED:?PKI_SMOKE_ENROLLMENT_SEED is required}
    volumes:
      - ./tests/e2e:/smoke:ro
    command: ["python", "/smoke/pki_jwks_fixture.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20

  pki-service:
    depends_on:
      enrollment-service:
        condition: service_healthy
    environment:
      PKI_ENROLLMENT_JWKS_URL: http://enrollment-service:8000/.well-known/jwks.json

  pki-smoke-client:
    profiles: ["smoke"]
    build:
      context: ./services/pki-service
    restart: "no"
    network_mode: "service:pki-service"
    depends_on:
      pki-service:
        condition: service_healthy
    environment:
      PKI_SMOKE_ENROLLMENT_SEED: ${PKI_SMOKE_ENROLLMENT_SEED:?PKI_SMOKE_ENROLLMENT_SEED is required}
    volumes:
      - ./tests/e2e:/smoke:ro
    command: ["python", "/smoke/pki_smoke.py"]
    healthcheck:
      disable: true
