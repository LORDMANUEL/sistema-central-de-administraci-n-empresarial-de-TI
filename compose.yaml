name: it-guardian

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guardian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-guardian_identity}
    volumes:
      - guardian-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - guardian-nats:/data
    ports:
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"

  identity-service:
    build:
      context: ./services/identity-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      IDENTITY_ENVIRONMENT: ${GUARDIAN_ENV:-production}
      IDENTITY_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-guardian}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-guardian_identity}
      IDENTITY_SIGNING_KEY: ${IDENTITY_SIGNING_KEY:?IDENTITY_SIGNING_KEY is required}
      IDENTITY_JWT_KEY_ID: ${IDENTITY_JWT_KEY_ID:-identity-ed25519-v1}
      IDENTITY_JWT_ISSUER: ${IDENTITY_JWT_ISSUER:-urn:it-guardian:identity}
      IDENTITY_JWT_AUDIENCE: ${IDENTITY_JWT_AUDIENCE:-it-guardian-services}
      IDENTITY_ACCESS_TOKEN_MINUTES: ${IDENTITY_ACCESS_TOKEN_MINUTES:-15}
      IDENTITY_REFRESH_TOKEN_DAYS: ${IDENTITY_REFRESH_TOKEN_DAYS:-7}
    ports:
      - "127.0.0.1:${IDENTITY_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  tenant-db-init:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-guardian}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TARGET_DB: ${TENANT_DB:-guardian_tenant}
    command:
      - sh
      - -ec
      - |
        case "$$TARGET_DB" in ''|*[!A-Za-z0-9_]*) echo "Invalid TARGET_DB" >&2; exit 2;; esac
        exists="$$(psql -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='$$TARGET_DB'")"
        if [ "$$exists" != "1" ]; then createdb "$$TARGET_DB"; fi

  tenant-migrate:
    build:
      context: ./services/tenant-service
    restart: "no"
    depends_on:
      tenant-db-init:
        condition: service_completed_successfully
    environment:
      TENANT_ENVIRONMENT: ${GUARDIAN_ENV:-production}
      TENANT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-guardian}:${POSTGRES_PASSWORD}@postgres:5432/${TENANT_DB:-guardian_tenant}
    command: ["alembic", "upgrade", "head"]
    healthcheck:
      disable: true

  tenant-service:
    build:
      context: ./services/tenant-service
    restart: unless-stopped
    depends_on:
      tenant-migrate:
        condition: service_completed_successfully
      identity-service:
        condition: service_healthy
    environment:
      TENANT_ENVIRONMENT: ${GUARDIAN_ENV:-production}
      TENANT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-guardian}:${POSTGRES_PASSWORD}@postgres:5432/${TENANT_DB:-guardian_tenant}
      TENANT_IDENTITY_JWKS_URL: http://identity-service:8000/.well-known/jwks.json
      TENANT_IDENTITY_ISSUER: ${IDENTITY_JWT_ISSUER:-urn:it-guardian:identity}
      TENANT_IDENTITY_AUDIENCE: ${IDENTITY_JWT_AUDIENCE:-it-guardian-services}
      TENANT_NATS_URL: nats://nats:4222
      TENANT_NATS_STREAM: GUARDIAN_EVENTS
    ports:
      - "127.0.0.1:${TENANT_PORT:-8002}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  tenant-outbox-worker:
    build:
      context: ./services/tenant-service
    restart: unless-stopped
    depends_on:
      tenant-migrate:
        condition: service_completed_successfully
      nats:
        condition: service_started
    environment:
      TENANT_ENVIRONMENT: ${GUARDIAN_ENV:-production}
      TENANT_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-guardian}:${POSTGRES_PASSWORD}@postgres:5432/${TENANT_DB:-guardian_tenant}
      TENANT_NATS_URL: nats://nats:4222
      TENANT_NATS_STREAM: GUARDIAN_EVENTS
    command: ["python", "-m", "app.outbox_worker"]
    healthcheck:
      disable: true

volumes:
  guardian-postgres:
  guardian-nats:
