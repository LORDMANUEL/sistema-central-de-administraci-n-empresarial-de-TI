[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "it-guardian-web-console-service"
version = "0.8.0.dev1"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "redis>=5,<7",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "fakeredis>=2.30,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["app"]
