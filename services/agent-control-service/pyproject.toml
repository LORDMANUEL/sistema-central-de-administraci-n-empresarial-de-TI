[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "it-guardian-agent-control-service"
version = "0.6.0.dev1"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
test = [
  "pytest>=9,<10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
