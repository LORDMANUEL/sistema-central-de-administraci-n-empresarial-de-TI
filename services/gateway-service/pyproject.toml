[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "it-guardian-gateway-service"
version = "0.5.0.dev1"
description = "IT Guardian controlled northbound HTTP gateway"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "PyJWT>=2.10,<3",
  "cryptography>=45,<47",
  "nats-py>=2.10,<3",
  "prometheus-client>=0.22,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["app"]
