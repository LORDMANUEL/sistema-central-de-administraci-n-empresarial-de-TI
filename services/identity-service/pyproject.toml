[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "it-guardian-identity-service"
version = "0.1.0.dev1"
description = "IT Guardian identity, authentication and RBAC microservice"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.128,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "argon2-cffi>=25,<26",
  "PyJWT>=2.10,<3",
  "email-validator>=2.2,<3",
  "prometheus-client>=0.22,<1",
  "alembic>=1.16,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=9,<10",
  "httpx>=0.28,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["app"]
